      neumorphic-glass-surface-strong: "rgba(51, 54, 59, 0.84)"
      neumorphic-glass-border: "transparent"
      neumorphic-glass-highlight: "rgba(255, 255, 255, 0.16)"
      neumorphic-card-sheen: "rgba(255, 255, 255, 0.05)"
      neumorphic-led-off: "#1f2124"
      neumorphic-led-on: "#3ee08a"
      neumorphic-neon-blue-rgb: "42, 44, 48"
      neumorphic-neon-violet-rgb: "42, 44, 48"
      neumorphic-neon-cyan-rgb: "42, 44, 48"
      neumorphic-bg-pattern: "radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.55) 0 1px, rgba(255, 255, 255, 0.06) 1.4px, transparent 1.6px)"
      neumorphic-led-warn: "#f5b041"
      neumorphic-led-alarm: "#f87171"
      neumorphic-lcd-bg: "rgba(0, 0, 0, 0.28)"
      neumorphic-lcd-shadow: "inset 2px 2px 5px rgba(0, 0, 0, 0.55), inset -1px -1px 2px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.03)"
      an-glyph-on-dark: "1"
      neumorphic-led-lip: "rgba(255, 255, 255, 0.06)"

      # Convex (raised) shadows
      neumorphic-convex-shadow-xs: "2px 2px 5px #1c1d20, -2px -2px 5px #393c42, inset 1px 1px 0 rgba(255, 255, 255, 0.07), inset -1px -1px 0 rgba(0, 0, 0, 0.45)"
      neumorphic-convex-shadow-sm: "4px 4px 9px #1c1d20, -4px -4px 9px #393c42, inset 1px 1px 0 rgba(255, 255, 255, 0.07), inset -1px -1px 0 rgba(0, 0, 0, 0.45)"
      neumorphic-convex-shadow-md: "8px 8px 18px #1c1d20, -8px -8px 18px #393c42, inset 1px 1px 0 rgba(255, 255, 255, 0.07), inset -1px -1px 0 rgba(0, 0, 0, 0.45)"
      neumorphic-convex-shadow-lg: "12px 12px 26px #1c1d20, -12px -12px 26px #393c42, inset 1px 1px 0 rgba(255, 255, 255, 0.07), inset -1px -1px 0 rgba(0, 0, 0, 0.45)"
      neumorphic-convex-shadow-xl: "16px 16px 34px #1c1d20, -16px -16px 34px #393c42, inset 1px 1px 0 rgba(255, 255, 255, 0.07), inset -1px -1px 0 rgba(0, 0, 0, 0.45)"

      # Concave (inset) shadows
      neumorphic-concave-shadow-xs: "inset 2px 2px 3px #1c1d20, inset -2px -2px 3px #393c42, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.05)"
      neumorphic-concave-shadow-sm: "inset 3px 3px 6px #1c1d20, inset -3px -3px 6px #393c42, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.05)"
      neumorphic-concave-shadow-md: "inset 5px 5px 10px #1c1d20, inset -5px -5px 10px #393c42, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.05)"
      neumorphic-concave-shadow-lg: "inset 7px 7px 14px #1c1d20, inset -7px -7px 14px #393c42, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.05)"

      # Interactive states
      neumorphic-hover-shadow: "11px 11px 24px #1c1d20, -11px -11px 24px #393c42, inset 1px 1px 0 rgba(255, 255, 255, 0.07), inset -1px -1px 0 rgba(0, 0, 0, 0.45)"
      neumorphic-active-shadow: "inset 5px 5px 10px #1c1d20, inset -5px -5px 10px #393c42, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.05)"

      # Flat shadow
      neumorphic-flat-shadow: "0 0.125rem 0.25rem rgba(0, 0, 0, 0.2)"

      # Unsuffixed aliases (used by card-mod/button-card styles)
      neumorphic-convex-shadow: "var(--neumorphic-convex-shadow-sm)"
      neumorphic-concave-shadow: "var(--neumorphic-concave-shadow-sm)"
  # ===========================================================================
  # ALEXANDER UIX LAYER — global shell, cards, controls and dialogs
  # ===========================================================================
  uix-theme: "Alexander Neumorphism"
  card-mod-theme: "Alexander Neumorphism"

  # Subtle cold-neon mist shared by cards and controls.
  # RGB triplets are kept as tokens so opacity stays intentionally restrained.
  # marble/smoke texture retired 2026-11-04 (looked different on every card)
  neumorphic-smoke-image: "none"

  # Modern HA typography and component aliases
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-heading: var(--primary-font-family)
  ha-font-family-code: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  mdc-typography-font-family: var(--primary-font-family)
  ha-card-features-border-radius: 12px
  ha-card-border-radius: 14px
  ha-card-border-width: 0px
  lovelace-background: var(--primary-background-color)
  paper-dialog-background-color: var(--neumorphic-surface)
  ha-dialog-surface-background: var(--neumorphic-surface)
  ha-dialog-surface-box-shadow: var(--neumorphic-convex-shadow-lg)
  dialog-box-shadow: var(--neumorphic-convex-shadow-lg)
  ha-dialog-border-radius: 18px
  ha-button-border-radius: 12px
  ha-button-height: 42px
  ha-color-form-background: var(--neumorphic-surface-alt)
  ha-color-form-background-hover: var(--neumorphic-surface-alt)
  ha-color-form-background-disabled: var(--neumorphic-surface-alt)
  wa-border-style: none
  wa-border-radius-s: 10px
  wa-border-radius-m: 14px
  wa-shadow-s: var(--neumorphic-convex-shadow-xs)
  wa-shadow-m: var(--neumorphic-convex-shadow-sm)

  uix-drawer: |
    .mdc-drawer {
      background: var(--neumorphic-surface) !important;
      border: 0 !important;
      box-shadow: var(--neumorphic-convex-shadow-sm) !important;
      font-family: var(--primary-font-family) !important;
    }

  uix-sidebar-yaml: |
    .: |
      :host {
        background: var(--neumorphic-surface) !important;
        font-family: var(--primary-font-family) !important;
      }
      ha-md-list-item {
        margin: 3px 8px;
        border-radius: 11px !important;
        transition: color .18s ease, background .18s ease, box-shadow .18s ease;
      }
      ha-md-list-item.selected::before {
        border-radius: 11px !important;
        background: var(--neumorphic-surface-alt) !important;
        box-shadow: var(--neumorphic-concave-shadow-sm) !important;
      }
      ha-md-list-item:not(.selected):hover::before {
        border-radius: 11px !important;
        background: color-mix(in srgb, var(--primary-color) 8%, transparent) !important;
      }

  uix-root-yaml: |
    .: |
      @font-face {
        font-family: "Nunito Sans Local";
        src: url("/local/alexander-neumorphism/nunito-sans-variable.ttf") format("truetype");
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
      }
      :host {
        --mdc-typography-font-family: var(--primary-font-family);
      }
      /* Console faceplate: fine speaker-grille perforation behind the cards */
      hui-view-background {
        background: var(--neumorphic-bg-pattern) 0 0 / 14px 14px, var(--primary-background-color) !important;
      }
      .header,
      .toolbar,
      [main-title],
      ha-menu-button,
      ha-button-menu,
      .action-items,
      ha-dialog,
      ha-md-dialog {
        font-family: var(--primary-font-family) !important;
      }
      ha-menu-button,
      ha-button-menu,
      ha-icon-button,
      ha-back-button {
        border-radius: 50%;
      }
    ha-button $: |
      button,
      .mdc-button {
        border-radius: 12px !important;
        background:
          linear-gradient(180deg, var(--neumorphic-card-sheen) 0%, transparent 60%),
          var(--neumorphic-glass-surface-strong) !important;
        border: 1px solid var(--neumorphic-glass-border) !important;
        -webkit-backdrop-filter: blur(8px) saturate(1.08);
        backdrop-filter: blur(8px) saturate(1.08);
        box-shadow: var(--neumorphic-convex-shadow-sm) !important;
        transition: transform .12s ease, box-shadow .12s ease !important;
      }
      button:active,
      .mdc-button:active {
        transform: translateY(1px);
        box-shadow: var(--neumorphic-active-shadow) !important;
      }
    ha-icon-button $: |
      button {
        border-radius: 50% !important;
        background:
          radial-gradient(circle at 28% 18%, rgba(var(--neumorphic-neon-cyan-rgb), .12), transparent 48%),
          radial-gradient(circle at 80% 85%, rgba(var(--neumorphic-neon-violet-rgb), .09), transparent 52%),
          var(--neumorphic-glass-surface);
        border: 1px solid var(--neumorphic-glass-border) !important;
        -webkit-backdrop-filter: blur(7px) saturate(1.08);
        backdrop-filter: blur(7px) saturate(1.08);
        box-shadow:
          inset 0 1px 0 var(--neumorphic-glass-highlight),
          inset 0 0 10px rgba(var(--neumorphic-neon-blue-rgb), .025);
        transition: box-shadow .12s ease, transform .12s ease !important;
      }
      button:active {
        transform: scale(.96);
        box-shadow: var(--neumorphic-concave-shadow-xs) !important;
      }
    ha-textfield $: |
      .mdc-text-field {
        border-radius: 11px !important;
        background: var(--neumorphic-surface-alt) !important;
        box-shadow: var(--neumorphic-concave-shadow-sm) !important;
      }
    ha-select $: |
      .mdc-select__anchor {
        border-radius: 11px !important;
        background: var(--neumorphic-surface-alt) !important;
        box-shadow: var(--neumorphic-concave-shadow-sm) !important;
      }

  uix-top-app-bar-fixed: |
    :host {
      background: var(--neumorphic-surface) !important;
      box-shadow: 0 3px 10px var(--shadow-color) !important;
      font-family: var(--primary-font-family) !important;
    }


  uix-grid-section: |
    :host {
      --grid-card-gap: 16px;
    }

  uix-card-yaml: |
    .: |
      :host,
      ha-card {
        font-family: var(--primary-font-family) !important;
      }
      ha-card {
        overflow: hidden;
        /* modern frosted glass: same look on every card, no random texture crop */
        background:
          linear-gradient(180deg, var(--neumorphic-card-sheen) 0%, transparent 46%),
          var(--neumorphic-glass-surface);
        border: 1px solid var(--neumorphic-glass-border) !important;
        border-radius: 14px !important;
        -webkit-backdrop-filter: blur(10px) saturate(1.1);
        backdrop-filter: blur(10px) saturate(1.1);
        box-shadow: var(--neumorphic-convex-shadow-md);
        /* numbers do not jump when values update */
        font-variant-numeric: tabular-nums;
        transition:
          box-shadow .28s cubic-bezier(.2, .8, .2, 1),
          transform .2s cubic-bezier(.2, .8, .2, 1),
          background .35s ease;
      }
      /* CONSOLE: tiles stay raised; the state is shown by the LED and the icon key */
      /* Status LED in the top-right corner of every tile */
      :host(hui-tile-card) ha-card {
        position: relative;
      }
      /* dark mode: the lit key shows its glyph in the lamp colour (plugin paints it near-black) */
      @container style(--an-glyph-on-dark: 1) {
        ha-tile-icon ha-state-icon[style*="color: "] {
          color: var(--tile-color) !important;
        }
      }
      /* icon = toggle key: ON is latched (pressed in) */
      ha-card.active ha-tile-icon {
        --an-well-shadow: var(--neumorphic-concave-shadow-sm);
        --an-well-bg: var(--neumorphic-surface-alt);
      }
      :host(hui-tile-card) ha-card::after {
        content: "";
        position: absolute;
        top: 9px;
        right: 9px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--neumorphic-led-off);
        box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .22), 1px 1px 0 var(--neumorphic-led-lip);
        transition: background .3s ease, box-shadow .3s ease;
        pointer-events: none;
        z-index: 2;
      }
      /* people / status tiles (icon with a badge) are not switches: no LED */
      :host(hui-tile-card) ha-card:has(ha-tile-badge)::after {
        display: none;
      }
      /* LED language: amber blinking = device unavailable */
      @keyframes an-led-blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
      :host(hui-tile-card) ha-card:has(ha-tile-badge[style*="orange"])::after {
        display: block;
        background: var(--neumorphic-led-warn);
        box-shadow: 0 0 6px var(--neumorphic-led-warn), 0 0 14px color-mix(in srgb, var(--neumorphic-led-warn) 55%, transparent);
        animation: an-led-blink 1.6s ease-in-out infinite;
      }
      /* LED language: red = alarm / problem / leak / smoke */
      :host(hui-tile-card) ha-card.active:is([style*="red-color"], [style*="problem"], [style*="moisture"], [style*="smoke"], [style*="gas"], [style*="safety"], [style*="carbon"], [style*="triggered"], [style*="tamper"])::after {
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .8) 0 18%, transparent 45%), var(--neumorphic-led-alarm) !important;
        box-shadow: 0 0 6px var(--neumorphic-led-alarm), 0 0 16px color-mix(in srgb, var(--neumorphic-led-alarm) 60%, transparent) !important;
      }
      @media (prefers-reduced-motion: reduce) {
        :host(hui-tile-card) ha-card::after { animation: none !important; }
      }
      :host(hui-tile-card) ha-card.active::after {
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .85) 0 18%, transparent 45%), var(--neumorphic-led-on);
        box-shadow: 0 0 6px var(--neumorphic-led-on), 0 0 16px color-mix(in srgb, var(--neumorphic-led-on) 60%, transparent);
      }
      /* Press feedback: card sinks a little (tiles without sliders, buttons) */
      :host(hui-tile-card) ha-card:not(:has(hui-card-features)):active,
      :host(hui-button-card) ha-card:active,
      :host(button-card) ha-card:active {
        transform: scale(.985);
        box-shadow: var(--neumorphic-convex-shadow-sm);
        transition-duration: .1s;
      }
      @media (prefers-reduced-motion: reduce) {
        ha-card { transition: none !important; }
      }
      @media (hover: hover) and (pointer: fine) {
        ha-card:hover {
          box-shadow: var(--neumorphic-hover-shadow);
          transform: translateY(-1px);
        }
      }
      :host(hui-heading-card) ha-card,
      :host(mushroom-title-card) ha-card,
      ha-card.text-only {
        background: transparent !important;
        box-shadow: none !important;
        overflow: visible;
      }
      :host(mushroom-chips-card) ha-card {
        background: transparent !important;
        box-shadow: none !important;
      }
      /* Keep media, camera and picture cards visually intact. */
      :host(hui-picture-card) ha-card,
      :host(hui-picture-entity-card) ha-card,
      :host(hui-picture-glance-card) ha-card {
        overflow: hidden;
      }
      /* Modern Tile/Mushroom typography and control tokens. */
      :host {
        --ha-tile-info-primary-font-size: 15px;
        --ha-tile-info-secondary-font-size: 13px;
        /* clearer hierarchy: name firm, state quieter */
        --ha-tile-info-primary-font-weight: 650;
        --ha-tile-info-primary-letter-spacing: -0.01em;
        --ha-tile-info-secondary-color: var(--secondary-text-color);
        /* springy switches and toggles inside cards */
        --wa-transition-normal: 260ms;
        --wa-transition-easing: cubic-bezier(.34, 1.45, .64, 1);
        --control-slider-background: var(--neumorphic-surface-alt);
        --control-slider-background-opacity: 1;
      }
    hui-card-features $ hui-card-feature $ area-controls-dim $: |
      ha-control-button {
        border-radius: 12px;
        box-shadow: var(--neumorphic-convex-shadow-xs);
        --control-button-background-opacity: 0;
        transition: box-shadow .2s cubic-bezier(.2, .8, .2, 1);
      }
      ha-control-button:not([style*="-off-color"]):not([style*="unavailable"]):not([style*="closed"]) {
        box-shadow: var(--neumorphic-concave-shadow-sm);
        --control-button-background-opacity: .14;
      }
    hui-card-features $ hui-card-feature $ hui-area-controls-card-feature $: |
      ha-control-button {
        border-radius: 12px;
        box-shadow: var(--neumorphic-convex-shadow-xs);
        --control-button-background-opacity: 0;
        transition: box-shadow .2s cubic-bezier(.2, .8, .2, 1);
      }
      ha-control-button:not([style*="-off-color"]):not([style*="unavailable"]):not([style*="closed"]) {
        box-shadow: var(--neumorphic-concave-shadow-sm);
        --control-button-background-opacity: .14;
      }
    ha-tile-icon $: |
      .container {
        /* OFF: raised key. ON: latched key, backlit with the lamp's own colour;
           glow size/colour come from Alexander Neumorphism Plus and follow brightness live */
        box-shadow:
          var(--an-well-shadow, var(--neumorphic-convex-shadow-xs)),
          0 0 calc(var(--an-glow-size, 0px) * 2.2) calc(var(--an-glow-size, 0px) * .35) var(--an-glow-color, transparent),
          inset 0 0 calc(var(--an-glow-size, 0px) * 1.2) var(--an-glow-color, transparent) !important;
        background:
          radial-gradient(circle at 50% 55%, var(--an-glow-color, transparent), transparent 72%),
          var(--an-well-bg, var(--neumorphic-surface)) !important;
        transition: box-shadow .2s cubic-bezier(.2, .8, .2, 1), background .2s ease !important;
      }
    hui-tile-card $ ha-tile-container $: |
      .container {
        border-radius: 12px !important;
      }
      .content {
        border-radius: 12px !important;
      }
    hui-card-features $ hui-card-feature $ ha-control-slider $: |
      .slider {
        border-radius: 999px !important;
        background: var(--neumorphic-surface-alt) !important;
        box-shadow: var(--neumorphic-concave-shadow-sm) !important;
      }

  uix-row: |
    :host {
      --wa-transition-normal: 260ms;
      --wa-transition-easing: cubic-bezier(.34, 1.45, .64, 1);
      font-variant-numeric: tabular-nums;
      border-radius: 10px;
      transition: background .15s ease, box-shadow .15s ease;
    }
    :host(:hover) {
      background: color-mix(in srgb, var(--primary-color) 7%, transparent);
    }

  uix-assist-chip: |
    :host {
      border-radius: 999px !important;
      background: var(--neumorphic-glass-surface-strong) !important;
      border: 1px solid var(--neumorphic-glass-border) !important;
      -webkit-backdrop-filter: blur(8px) saturate(1.08);
      backdrop-filter: blur(8px) saturate(1.08);
      box-shadow: var(--neumorphic-convex-shadow-sm) !important;
    }
    :host(:active) {
      box-shadow: var(--neumorphic-concave-shadow-sm) !important;
    }

  uix-dialog-yaml: |
    .: |
      :host {
        --ha-dialog-border-radius: 18px;
        --ha-dialog-surface-background: var(--neumorphic-surface);
      }
      ha-dialog::part(dialog),
      ha-md-dialog::part(dialog),
      ha-adaptive-dialog::part(dialog) {
        border-radius: 18px !important;
        background: var(--neumorphic-surface) !important;
        box-shadow: var(--neumorphic-convex-shadow-lg) !important;
      }

  uix-more-info: |
    :host {
      --more-info-header-background: var(--neumorphic-surface-alt);
      font-family: var(--primary-font-family) !important;
    }

  uix-toast: |
    :host {
      border-radius: 12px !important;
      box-shadow: var(--neumorphic-convex-shadow-md) !important;
    }

  uix-developer-tools: |
    :host {
      --code-editor-background-color: var(--neumorphic-surface-alt);
      font-family: var(--primary-font-family) !important;
    }
