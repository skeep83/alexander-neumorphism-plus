# ==============================================================================
# Alexander Neumorphism — full Home Assistant + UIX theme
# Based on skeep83/neumorphism-ui-bootstrap and Neumorphism Pro (MIT)
# ==============================================================================
#
# Design Philosophy:
#   - Every HA CSS variable defined for seamless native experience
#   - Neumorphic (soft-UI) shadows: convex (raised) & concave (inset)
#   - Themesberg-inspired base palette: #e6e7ee light / #2a2c30 graphite dark
#   - Typography: Nunito Sans (Google Fonts)
#   - 0.55rem border radius (Themesberg reference)
#   - Card-mod ready with custom neumorphic variables
#
# ==============================================================================

Alexander Neumorphism:
  modes:
    # =========================================================================
    # LIGHT MODE
    # =========================================================================
    light:
      # -----------------------------------------------------------------------
      # TYPOGRAPHY
      # -----------------------------------------------------------------------
      primary-font-family: "'Nunito Sans Local', 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      paper-font-common-base_-_font-family: "'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

      # -----------------------------------------------------------------------
      # PRIMARY & ACCENT
      # -----------------------------------------------------------------------
      primary-color: "#4A6FA5"
      dark-primary-color: "#3A5A8A"
      darker-primary-color: "#2D4770"
      light-primary-color: "#7A9FD5"
      accent-color: "#FF9800"
      divider-color: "rgba(49, 52, 75, 0.12)"
      outline-color: "rgba(49, 52, 75, 0.12)"
      outline-hover-color: "rgba(49, 52, 75, 0.24)"
      shadow-color: "rgba(49, 52, 75, 0.16)"

      # -----------------------------------------------------------------------
      # TEXT COLORS
      # -----------------------------------------------------------------------
      primary-text-color: "#31344b"
      secondary-text-color: "#44476a"
      text-primary-color: "#ffffff"
      text-light-primary-color: "#31344b"
      disabled-text-color: "#7c8aa3"

      # -----------------------------------------------------------------------
      # RGB VALUES (for rgba() usage throughout HA)
      # -----------------------------------------------------------------------
      rgb-primary-color: "74, 111, 165"
      rgb-accent-color: "255, 152, 0"
      rgb-primary-text-color: "49, 52, 75"
      rgb-secondary-text-color: "68, 71, 106"
      rgb-text-primary-color: "255, 255, 255"
      rgb-card-background-color: "230, 231, 238"
      rgb-warning-color: "240, 180, 0"
      rgb-error-color: "169, 30, 44"
      rgb-success-color: "24, 99, 75"
      rgb-info-color: "74, 111, 165"

      # -----------------------------------------------------------------------
      # BACKGROUNDS
      # -----------------------------------------------------------------------
      primary-background-color: "#e6e7ee"
      secondary-background-color: "#dfe0e7"
      card-background-color: "#e6e7ee"
      clear-background-color: "#e6e7ee"

      # -----------------------------------------------------------------------
      # STATUS COLORS
      # -----------------------------------------------------------------------
      error-color: "#A91E2C"
      warning-color: "#F0B400"
      success-color: "#18634B"
      info-color: "#4A6FA5"

      # -----------------------------------------------------------------------
      # SCROLLBAR
      # -----------------------------------------------------------------------
      scrollbar-thumb-color: "rgba(49, 52, 75, 0.2)"

      # -----------------------------------------------------------------------
      # STATE ICONS
      # -----------------------------------------------------------------------
      state-icon-color: "#44476a"
      state-icon-active-color: "#4A6FA5"
      state-icon-unavailable-color: "#7c8aa3"
      state-icon-error-color: "var(--error-color)"

      # State active/inactive base
      state-active-color: "var(--amber-color)"
      state-inactive-color: "#6b6f86"
      state-unavailable-color: "var(--disabled-text-color)"

      # Legacy on/off
      state-on-color: "#18634B"
      state-off-color: "#7c8aa3"

      # -----------------------------------------------------------------------
      # FULL COLOR PALETTE (Material — used by graphs, calendars, maps, badges)
      # -----------------------------------------------------------------------
      disabled-color: "#bdbdbd"
      red-color: "#f44336"
      pink-color: "#e91e63"
      purple-color: "#926bc7"
      deep-purple-color: "#6e41ab"
      indigo-color: "#3f51b5"
      blue-color: "#2196f3"
      light-blue-color: "#03a9f4"
      cyan-color: "#00bcd4"
      teal-color: "#009688"
      green-color: "#4caf50"
      light-green-color: "#8bc34a"
      lime-color: "#cddc39"
      yellow-color: "#ffeb3b"
      amber-color: "#ffc107"
      orange-color: "#ff9800"
      deep-orange-color: "#ff6f22"
      brown-color: "#795548"
      light-grey-color: "#bdbdbd"
      grey-color: "#9e9e9e"
      dark-grey-color: "#606060"
      blue-grey-color: "#607d8b"
      black-color: "#000000"
      white-color: "#ffffff"

      # -----------------------------------------------------------------------
      # GRAPH / CALENDAR COLORS (color-1 through color-54)
      # -----------------------------------------------------------------------
      color-1: "#4269d0"
      color-2: "#f4bd4a"
      color-3: "#ff725c"
      color-4: "#6cc5b0"
      color-5: "#a463f2"
      color-6: "#ff8ab7"
      color-7: "#9c6b4e"
      color-8: "#97bbf5"
      color-9: "#01ab63"
      color-10: "#094bad"
      color-11: "#c99000"
      color-12: "#d84f3e"
      color-13: "#49a28f"
      color-14: "#048732"
      color-15: "#d96895"
      color-16: "#8043ce"
      color-17: "#7599d1"
      color-18: "#7a4c31"
      color-19: "#6989f4"
      color-20: "#ffd444"
      color-21: "#ff957c"
      color-22: "#8fe9d3"
      color-23: "#62cc71"
      color-24: "#ffadda"
      color-25: "#c884ff"
      color-26: "#badeff"
      color-27: "#bf8b6d"
      color-28: "#927acc"
      color-29: "#97ee3f"
      color-30: "#bf3947"
      color-31: "#9f5b00"
      color-32: "#f48758"
      color-33: "#8caed6"
      color-34: "#f2b94f"
      color-35: "#eff26e"
      color-36: "#e43872"
      color-37: "#d9b100"
      color-38: "#9d7a00"
      color-39: "#698cff"
      color-40: "#00d27e"
      color-41: "#d06800"
      color-42: "#009f82"
      color-43: "#c49200"
      color-44: "#cbe8ff"
      color-45: "#fecddf"
      color-46: "#c27eb6"
      color-47: "#8cd2ce"
      color-48: "#c4b8d9"
      color-49: "#f883b0"
      color-50: "#a49100"
      color-51: "#f48800"
      color-52: "#27d0df"
      color-53: "#a04a9b"
      color-54: "#4269d0"

      # -----------------------------------------------------------------------
      # ENERGY DASHBOARD COLORS
      # -----------------------------------------------------------------------
      energy-grid-consumption-color: "#488fc2"
      energy-grid-return-color: "#8353d1"
      energy-solar-color: "#ff9800"
      energy-non-fossil-color: "#0f9d58"
      energy-battery-out-color: "#4db6ac"
      energy-battery-in-color: "#f06292"
      energy-gas-color: "#8e021b"
      energy-water-color: "#00bcd4"

      # -----------------------------------------------------------------------
      # STATE DOMAIN COLORS
      # -----------------------------------------------------------------------
      # Alarm Control Panel
      state-alarm_control_panel-armed_away-color: "var(--green-color)"
      state-alarm_control_panel-armed_custom_bypass-color: "var(--green-color)"
      state-alarm_control_panel-armed_home-color: "var(--green-color)"
      state-alarm_control_panel-armed_night-color: "var(--green-color)"
      state-alarm_control_panel-armed_vacation-color: "var(--green-color)"
      state-alarm_control_panel-arming-color: "var(--orange-color)"
      state-alarm_control_panel-disarming-color: "var(--orange-color)"
      state-alarm_control_panel-pending-color: "var(--orange-color)"
      state-alarm_control_panel-triggered-color: "var(--red-color)"

      # Alert
      state-alert-off-color: "var(--orange-color)"
      state-alert-on-color: "var(--red-color)"

      # Binary Sensor
      state-binary_sensor-active-color: "var(--amber-color)"
      state-binary_sensor-battery-on-color: "var(--red-color)"
      state-binary_sensor-carbon_monoxide-on-color: "var(--red-color)"
      state-binary_sensor-gas-on-color: "var(--red-color)"
      state-binary_sensor-heat-on-color: "var(--red-color)"
      state-binary_sensor-lock-on-color: "var(--red-color)"
      state-binary_sensor-moisture-on-color: "var(--red-color)"
      state-binary_sensor-problem-on-color: "var(--red-color)"
      state-binary_sensor-safety-on-color: "var(--red-color)"
      state-binary_sensor-smoke-on-color: "var(--red-color)"
      state-binary_sensor-sound-on-color: "var(--red-color)"
      state-binary_sensor-tamper-on-color: "var(--red-color)"

      # Climate
      state-climate-auto-color: "var(--green-color)"
      state-climate-cool-color: "var(--blue-color)"
      state-climate-dry-color: "var(--orange-color)"
      state-climate-fan_only-color: "var(--cyan-color)"
      state-climate-heat-color: "var(--deep-orange-color)"
      state-climate-heat-cool-color: "var(--amber-color)"

      # Cover, Device Tracker, Fan, Humidifier
      state-cover-active-color: "var(--purple-color)"
      state-device_tracker-active-color: "var(--blue-color)"
      state-device_tracker-home-color: "var(--green-color)"
      state-fan-active-color: "var(--cyan-color)"
      state-humidifier-on-color: "var(--blue-color)"

      # Lawn Mower
      state-lawn_mower-error-color: "var(--red-color)"
      state-lawn_mower-mowing-color: "var(--teal-color)"

      # Light
      state-light-active-color: "var(--amber-color)"

      # Lock
      state-lock-jammed-color: "var(--red-color)"
      state-lock-locked-color: "var(--green-color)"
      state-lock-locking-color: "var(--orange-color)"
      state-lock-unlocked-color: "var(--red-color)"
      state-lock-unlocking-color: "var(--orange-color)"
      state-lock-open-color: "var(--red-color)"
      state-lock-opening-color: "var(--orange-color)"

      # Media Player, Person, Plant, Siren
      state-media_player-active-color: "var(--light-blue-color)"
      state-person-active-color: "var(--blue-color)"
      state-person-home-color: "var(--green-color)"
      state-plant-active-color: "var(--red-color)"
      state-siren-active-color: "var(--red-color)"

      # Sun
      state-sun-above_horizon-color: "var(--amber-color)"
      state-sun-below_horizon-color: "var(--indigo-color)"

      # Switch, Update, Vacuum, Valve
      state-switch-active-color: "var(--amber-color)"
      state-update-active-color: "var(--orange-color)"
      state-vacuum-active-color: "var(--teal-color)"
      state-valve-active-color: "var(--blue-color)"

      # Sensor Battery
      state-sensor-battery-high-color: "var(--green-color)"
      state-sensor-battery-low-color: "var(--red-color)"
      state-sensor-battery-medium-color: "var(--orange-color)"

      # Water Heater
      state-water_heater-eco-color: "var(--green-color)"
      state-water_heater-electric-color: "var(--orange-color)"
      state-water_heater-gas-color: "var(--orange-color)"
      state-water_heater-heat_pump-color: "var(--orange-color)"
      state-water_heater-high_demand-color: "var(--deep-orange-color)"
      state-water_heater-performance-color: "var(--deep-orange-color)"

      # Weather
      state-weather-clear_night-color: "var(--deep-purple-color)"
      state-weather-cloudy-color: "var(--light-grey-color)"
      state-weather-exceptional-color: "var(--red-color)"
      state-weather-fog-color: "var(--grey-color)"
      state-weather-hail-color: "var(--cyan-color)"
      state-weather-lightning_rainy-color: "var(--lime-color)"
      state-weather-lightning-color: "var(--yellow-color)"
      state-weather-partlycloudy-color: "var(--blue-grey-color)"
      state-weather-pouring-color: "var(--indigo-color)"
      state-weather-rainy-color: "var(--blue-color)"
      state-weather-snowy_rainy-color: "var(--light-blue-color)"
      state-weather-snowy-color: "#c0e0ff"
      state-weather-sunny-color: "var(--amber-color)"
      state-weather-windy_variant-color: "var(--green-color)"
      state-weather-windy-color: "var(--green-color)"

      # -----------------------------------------------------------------------
      # HISTORY COLORS
      # -----------------------------------------------------------------------
      history-unavailable-color: "transparent"
      history-unknown-color: "var(--dark-grey-color)"

      # -----------------------------------------------------------------------
      # HEADER
      # -----------------------------------------------------------------------
      app-header-background-color: "#e6e7ee"
      app-header-text-color: "#31344b"
      app-header-border-bottom: "none"
      app-header-edit-background-color: "#dfe0e7"
      app-header-edit-text-color: "#31344b"
      app-theme-color: "#e6e7ee"

      # -----------------------------------------------------------------------
      # SIDEBAR
      # -----------------------------------------------------------------------
      sidebar-background-color: "#e6e7ee"
      sidebar-text-color: "#31344b"
      sidebar-icon-color: "rgba(49, 52, 75, 0.6)"
      sidebar-selected-background-color: "#dfe0e7"
      sidebar-selected-text-color: "var(--primary-color)"
      sidebar-selected-icon-color: "var(--primary-color)"

      # -----------------------------------------------------------------------
      # CARDS (Neumorphic Styling)
      # -----------------------------------------------------------------------
      ha-card-background: "#e6e7ee"
      ha-card-border-radius: "14px"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      ha-card-box-shadow: "8px 8px 18px #b8b9be, -8px -8px 18px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"

      # -----------------------------------------------------------------------
      # LABELS & BADGES
      # -----------------------------------------------------------------------
      label-badge-background-color: "#e6e7ee"
      label-badge-text-color: "rgba(49, 52, 75, 0.8)"
      label-badge-grey: "#9e9e9e"
      label-badge-red: "var(--error-color)"
      label-badge-blue: "var(--info-color)"
      label-badge-green: "var(--success-color)"
      label-badge-yellow: "var(--warning-color)"

      # -----------------------------------------------------------------------
      # SWITCHES & TOGGLES
      # -----------------------------------------------------------------------
      switch-checked-color: "var(--primary-color)"
      switch-checked-button-color: "var(--primary-background-color)"
      switch-checked-track-color: "var(--primary-color)"
      switch-unchecked-button-color: "var(--primary-background-color)"
      switch-unchecked-track-color: "#b8b9be"
      toggle-button-color: "var(--primary-color)"
      toggle-button-unchecked-color: "#93a5be"

      # -----------------------------------------------------------------------
      # SLIDERS
      # -----------------------------------------------------------------------
      slider-color: "var(--primary-color)"
      slider-secondary-color: "var(--light-primary-color)"
      slider-bar-color: "#d1d9e6"
      slider-track-color: "var(--scrollbar-thumb-color)"
      paper-slider-knob-color: "var(--primary-color)"
      paper-slider-active-color: "var(--primary-color)"
      paper-slider-container-color: "#d1d9e6"
      paper-slider-disabled-active-color: "#93a5be"
      paper-slider-disabled-secondary-color: "#d1d9e6"

      # -----------------------------------------------------------------------
      # INPUT FIELDS (Full coverage)
      # -----------------------------------------------------------------------
      input-idle-line-color: "rgba(49, 52, 75, 0.42)"
      input-hover-line-color: "rgba(49, 52, 75, 0.87)"
      input-disabled-line-color: "rgba(49, 52, 75, 0.06)"
      input-outlined-idle-border-color: "rgba(49, 52, 75, 0.38)"
      input-outlined-hover-border-color: "rgba(49, 52, 75, 0.87)"
      input-outlined-disabled-border-color: "rgba(49, 52, 75, 0.06)"
      input-fill-color: "#dfe0e7"
      input-disabled-fill-color: "#e6e7ee"
      input-ink-color: "rgba(49, 52, 75, 0.87)"
      input-label-ink-color: "rgba(49, 52, 75, 0.6)"
      input-disabled-ink-color: "rgba(49, 52, 75, 0.37)"
      input-dropdown-icon-color: "rgba(49, 52, 75, 0.54)"

      # -----------------------------------------------------------------------
      # TABLES
      # -----------------------------------------------------------------------
      table-header-background-color: "var(--input-fill-color)"
      table-row-background-color: "#e6e7ee"
      table-row-alternative-background-color: "#dfe0e7"
      data-table-background-color: "#e6e7ee"

      # -----------------------------------------------------------------------
      # MARKDOWN
      # -----------------------------------------------------------------------
      markdown-code-background-color: "#dfe0e7"

      # -----------------------------------------------------------------------
      # MDC THEME (Material Design Components)
      # -----------------------------------------------------------------------
      mdc-theme-primary: "var(--primary-color)"
      mdc-theme-secondary: "var(--accent-color)"
      mdc-theme-background: "var(--primary-background-color)"
      mdc-theme-surface: "var(--card-background-color)"
      mdc-theme-on-primary: "var(--text-primary-color)"
      mdc-theme-on-secondary: "var(--text-primary-color)"
      mdc-theme-on-surface: "var(--primary-text-color)"
      mdc-theme-text-disabled-on-light: "var(--disabled-text-color)"
      mdc-theme-text-primary-on-background: "var(--primary-text-color)"
      mdc-theme-text-secondary-on-background: "var(--secondary-text-color)"
      mdc-theme-text-hint-on-background: "var(--secondary-text-color)"
      mdc-theme-text-icon-on-background: "var(--secondary-text-color)"
      mdc-theme-error: "var(--error-color)"

      # MDC Checkbox & Radio
      mdc-checkbox-unchecked-color: "rgba(49, 52, 75, 0.54)"
      mdc-checkbox-disabled-color: "var(--disabled-text-color)"
      mdc-radio-unchecked-color: "rgba(49, 52, 75, 0.54)"
      mdc-radio-disabled-color: "var(--disabled-text-color)"

      # MDC Tab
      mdc-tab-text-label-color-default: "var(--primary-text-color)"

      # MDC Button
      mdc-button-raised-box-shadow: "3px 3px 6px #b8b9be, -3px -3px 6px #ffffff"
      mdc-button-disabled-ink-color: "var(--disabled-text-color)"
      mdc-button-outline-color: "var(--outline-color)"

      # MDC Dialog
      mdc-dialog-scrim-color: "rgba(49, 52, 75, 0.4)"
      mdc-dialog-scroll-divider-color: "var(--divider-color)"
      mdc-dialog-heading-ink-color: "var(--primary-text-color)"
      mdc-dialog-content-ink-color: "var(--primary-text-color)"

      # MDC Top App Bar
      mdc-top-app-bar-fixed-box-shadow: "var(--bar-box-shadow)"

      # MDC Text Field (mapped from input vars)
      mdc-text-field-idle-line-color: "var(--input-idle-line-color)"
      mdc-text-field-hover-line-color: "var(--input-hover-line-color)"
      mdc-text-field-disabled-line-color: "var(--input-disabled-line-color)"
      mdc-text-field-outlined-idle-border-color: "var(--input-outlined-idle-border-color)"
      mdc-text-field-outlined-hover-border-color: "var(--input-outlined-hover-border-color)"
      mdc-text-field-outlined-disabled-border-color: "var(--input-outlined-disabled-border-color)"
      mdc-text-field-fill-color: "var(--input-fill-color)"
      mdc-text-field-disabled-fill-color: "var(--input-disabled-fill-color)"
      mdc-text-field-ink-color: "var(--input-ink-color)"
      mdc-text-field-label-ink-color: "var(--input-label-ink-color)"
      mdc-text-field-disabled-ink-color: "var(--input-disabled-ink-color)"

      # MDC Select (mapped from input vars)
      mdc-select-idle-line-color: "var(--input-idle-line-color)"
      mdc-select-hover-line-color: "var(--input-hover-line-color)"
      mdc-select-outlined-idle-border-color: "var(--input-outlined-idle-border-color)"
      mdc-select-outlined-hover-border-color: "var(--input-outlined-hover-border-color)"
      mdc-select-outlined-disabled-border-color: "var(--input-outlined-disabled-border-color)"
      mdc-select-fill-color: "var(--input-fill-color)"
      mdc-select-disabled-fill-color: "var(--input-disabled-fill-color)"
      mdc-select-ink-color: "var(--input-ink-color)"
      mdc-select-label-ink-color: "var(--input-label-ink-color)"
      mdc-select-disabled-ink-color: "var(--input-disabled-ink-color)"
      mdc-select-dropdown-icon-color: "var(--input-dropdown-icon-color)"
      mdc-select-disabled-dropdown-icon-color: "var(--input-disabled-ink-color)"

      # HA Assist Chips & Buttons
      ha-assist-chip-filled-container-color: "rgba(49, 52, 75, 0.15)"
      ha-assist-chip-active-container-color: "rgba(74, 111, 165, 0.15)"
      chip-background-color: "rgba(49, 52, 75, 0.15)"
      chip-text-color: "#31344b"
      chip-icon-color: "#44476a"
      chip-box-shadow: "3px 3px 6px #b8b9be, -3px -3px 6px #ffffff"

      # -----------------------------------------------------------------------
      # DIALOGS & MODALS
      # -----------------------------------------------------------------------
      dialog-backdrop-filter: "blur(10px)"

      # -----------------------------------------------------------------------
      # NOTIFICATIONS & TOASTS
      # -----------------------------------------------------------------------
      paper-toast-background-color: "#31344b"
      paper-toast-color: "#ffffff"

      # -----------------------------------------------------------------------
      # BAR SHADOW
      # -----------------------------------------------------------------------
      bar-box-shadow: "0 2px 12px var(--shadow-color)"

      # -----------------------------------------------------------------------
      # CODE EDITOR (Full CodeMirror support)
      # -----------------------------------------------------------------------
      code-editor-background-color: "#dfe0e7"
      codemirror-keyword: "#0056B3"
      codemirror-operator: "#31344b"
      codemirror-variable: "#A91E2C"
      codemirror-variable-2: "#44476a"
      codemirror-variable-3: "#F0B400"
      codemirror-builtin: "#ff9800"
      codemirror-atom: "#A91E2C"
      codemirror-number: "#F0B400"
      codemirror-def: "#4A6FA5"
      codemirror-string: "#18634B"
      codemirror-string-2: "#A91E2C"
      codemirror-comment: "#93a5be"
      codemirror-tag: "#A91E2C"
      codemirror-meta: "#ff9800"
      codemirror-attribute: "#926bc7"
      codemirror-property: "#926bc7"
      codemirror-qualifier: "#F0B400"
      codemirror-type: "#F0B400"

      # -----------------------------------------------------------------------
      # PAPER ELEMENTS (Legacy)
      # -----------------------------------------------------------------------
      paper-item-icon-color: "#44476a"
      paper-item-icon-active-color: "var(--primary-color)"

      # -----------------------------------------------------------------------
      # LAYOUT & SPACING
      # -----------------------------------------------------------------------
      masonry-view-card-margin: "8px"
      grid-card-gap: "16px"
      stack-card-margin: "8px"
      horizontal-stack-card-margin: "0 8px"
      vertical-stack-card-margin: "8px 0"

      # -----------------------------------------------------------------------
      # NEUMORPHIC CUSTOM VARIABLES (for card-mod)
      # -----------------------------------------------------------------------
      neumorphic-base: "#e6e7ee"
      neumorphic-base-rgb: "230, 231, 238"
      neumorphic-surface: "#e6e7ee"
      neumorphic-surface-alt: "#dfe0e7"
      neumorphic-shadow-light: "#ffffff"
      neumorphic-shadow-dark: "#b8b9be"
      # Restrained glass layer: translucent enough to catch the background,
      # but opaque enough to preserve text contrast in bright rooms.
      neumorphic-glass-surface: "rgba(242, 244, 250, 0.72)"
      neumorphic-glass-surface-strong: "rgba(242, 244, 250, 0.82)"
      neumorphic-glass-border: "transparent"
      neumorphic-glass-highlight: "rgba(255, 255, 255, 0.72)"
      neumorphic-card-sheen: "rgba(255, 255, 255, 0.45)"
      neumorphic-led-off: "#c9cbd3"
      neumorphic-led-on: "#34d27b"
      # neon tints retired: equal to the surface so old card_mod blobs (energy cards) vanish
      neumorphic-neon-blue-rgb: "230, 231, 238"
      neumorphic-neon-violet-rgb: "230, 231, 238"
      neumorphic-neon-cyan-rgb: "230, 231, 238"
      neumorphic-bg-pattern: "radial-gradient(circle at 50% 50%, rgba(150, 154, 176, 0.30) 0 1px, rgba(255, 255, 255, 0.85) 1.4px, transparent 1.6px)"
      neumorphic-led-warn: "#f5a524"
      neumorphic-led-alarm: "#ef4444"
      neumorphic-lcd-bg: "rgba(40, 48, 72, 0.055)"
      neumorphic-lcd-shadow: "inset 2px 2px 5px rgba(150, 152, 168, 0.55), inset -2px -2px 4px rgba(255, 255, 255, 0.9), inset 0 0 0 1px rgba(40, 48, 72, 0.05)"
      neumorphic-led-lip: "rgba(255, 255, 255, 0.7)"

      # Convex (raised) shadows — for cards, buttons
      neumorphic-convex-shadow-xs: "2px 2px 5px #b8b9be, -2px -2px 5px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"
      neumorphic-convex-shadow-sm: "4px 4px 9px #b8b9be, -4px -4px 9px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"
      neumorphic-convex-shadow-md: "8px 8px 18px #b8b9be, -8px -8px 18px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"
      neumorphic-convex-shadow-lg: "12px 12px 26px #b8b9be, -12px -12px 26px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"
      neumorphic-convex-shadow-xl: "16px 16px 34px #b8b9be, -16px -16px 34px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"

      # Concave (inset) shadows — for inputs, pressed states
      neumorphic-concave-shadow-xs: "inset 2px 2px 3px #b8b9be, inset -2px -2px 3px #ffffff, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.75)"
      neumorphic-concave-shadow-sm: "inset 3px 3px 6px #b8b9be, inset -3px -3px 6px #ffffff, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.75)"
      neumorphic-concave-shadow-md: "inset 5px 5px 10px #b8b9be, inset -5px -5px 10px #ffffff, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.75)"
      neumorphic-concave-shadow-lg: "inset 7px 7px 14px #b8b9be, inset -7px -7px 14px #ffffff, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.75)"

      # Interactive states
      neumorphic-hover-shadow: "11px 11px 24px #b8b9be, -11px -11px 24px #ffffff, inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(140, 143, 160, 0.22)"
      neumorphic-active-shadow: "inset 5px 5px 10px #b8b9be, inset -5px -5px 10px #ffffff, inset 1px 1px 1px rgba(0, 0, 0, 0.10), 1px 1px 0 rgba(255, 255, 255, 0.75)"

      # Flat shadow (very subtle)
      neumorphic-flat-shadow: "0 0.125rem 0.25rem rgba(31, 45, 61, 0.08)"

      # Unsuffixed aliases (used by card-mod/button-card styles)
      neumorphic-convex-shadow: "var(--neumorphic-convex-shadow-sm)"
      neumorphic-concave-shadow: "var(--neumorphic-concave-shadow-sm)"


